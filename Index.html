<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard da Banca 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:24px 16px}
  .app{max-width:860px;margin:0 auto}

  .topbar{background:#185FA5;border-radius:14px;padding:20px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
  .topbar-title{font-size:18px;font-weight:600;color:#E6F1FB}
  .topbar-sub{font-size:12px;color:#85B7EB;margin-top:3px}
  .topbar-right{text-align:right}
  .topbar-badge{font-size:12px;color:#85B7EB}
  .topbar-save{font-size:11px;color:#5DCAA5;margin-top:4px}

  .tab-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
  .tab-bar::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:8px 16px;border-radius:8px;border:1px solid #B5D4F4;background:#fff;font-size:13px;color:#185FA5;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500}
  .tab:hover{background:#E6F1FB}
  .tab.active{background:#185FA5;color:#E6F1FB;border-color:#185FA5}
  .tab.resumo-tab{border-color:#185FA5}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .card{background:#fff;border-radius:10px;padding:16px 18px;border:1px solid #B5D4F4}
  .card.green{background:#EAF3DE;border-color:#97C459}
  .card.red{background:#FCEBEB;border-color:#F09595}
  .card-label{font-size:11px;color:#185FA5;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .card.green .card-label{color:#3B6D11}
  .card.red .card-label{color:#A32D2D}
  .card-value{font-size:22px;font-weight:600;color:#0C447C}
  .card.green .card-value{color:#3B6D11}
  .card.red .card-value{color:#A32D2D}

  .table-wrap{background:#fff;border:1px solid #B5D4F4;border-radius:14px;overflow:hidden;margin-bottom:20px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{font-size:12px;font-weight:600;color:#0C447C;padding:11px 16px;text-align:left;border-bottom:1px solid #B5D4F4;background:#E6F1FB;letter-spacing:.3px}
  th.r{text-align:right}
  td{padding:10px 16px;font-size:13px;color:#2c3e50;border-bottom:1px solid #EEF4FB}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f7fbff}
  tr.total-row:hover td{background:#ddeaf8}
  tr.total-row td{font-weight:600;background:#E6F1FB;color:#0C447C;border-top:1px solid #B5D4F4}
  td.r{text-align:right}
  td.green{color:#3B6D11;font-weight:600;background:#EAF3DE}
  td.red{color:#A32D2D;font-weight:600;background:#FCEBEB}
  td.blue{color:#0C447C;text-align:right}
  td.date-cell{color:#185FA5;font-weight:500}

  td input{width:100%;background:transparent;border:none;outline:none;font-size:13px;color:#2c3e50;font-family:inherit;text-align:right;padding:0;cursor:pointer}
  td input:focus{background:#E6F1FB;border-radius:6px;padding:3px 8px;color:#042C53;cursor:text}
  td input::placeholder{color:#B5D4F4}

  .col-d{width:22%}.col-n{width:19.5%}

  .btn-export{background:#185FA5;color:#E6F1FB;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
  .btn-export:hover{background:#0C447C}
  .btn-export:active{transform:scale(.98)}

  .month-name-cell{font-weight:600;color:#0C447C}

  .footer{text-align:center;font-size:12px;color:#85B7EB;margin-top:12px}

  @media(max-width:600px){
    .cards{grid-template-columns:1fr 1fr}
    .card:first-child{grid-column:1/-1}
    .col-d{width:28%}.col-n{width:18%}
    body{padding:12px 8px}
    .topbar{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">Dashboard da Banca 2026</div>
      <div class="topbar-sub">Clique nas células para editar os valores</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-badge" id="topbar-mes"></div>
      <div class="topbar-save" id="save-status">Dados salvos automaticamente</div>
    </div>
  </div>

  <div class="tab-bar" id="tab-bar"></div>
  <div id="cards-row"></div>
  <div class="table-wrap"><table id="main-table"></table></div>
  <div style="display:flex;justify-content:flex-end;gap:10px">
    <button class="btn-export" onclick="exportCSV()">Exportar CSV</button>
  </div>
  <div class="footer">Os dados são salvos automaticamente no seu navegador.</div>
</div>

<script>
const MONTHS=[
  {name:'Janeiro',days:31},{name:'Fevereiro',days:28},{name:'Março',days:31},
  {name:'Abril',days:30},{name:'Maio',days:31},{name:'Junho',days:30},
  {name:'Julho',days:31},{name:'Agosto',days:31},{name:'Setembro',days:30},
  {name:'Outubro',days:31},{name:'Novembro',days:30},{name:'Dezembro',days:31}
];

const STORAGE_KEY='dashboard_banca_2026';
let data={};
let tab='resumo';

function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved){data=JSON.parse(saved);return;}
  }catch(e){}
  MONTHS.forEach((_,i)=>{
    data[i]=[];
    for(let d=0;d<MONTHS[i].days;d++) data[i].push({i:'',f:''});
  });
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    const el=document.getElementById('save-status');
    el.textContent='Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    el.style.color='#5DCAA5';
  }catch(e){}
}

function R(n,d=2){
  if(n===''||n===null||isNaN(n))return '';
  return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function Pct(n){return isNaN(n)||n===''?'':((n*100).toFixed(2)+'%');}
function gc(v){if(v===''||v===null||isNaN(v))return '';return v>0?'green':v<0?'red':'';}
function getDate(mi,di){return new Date(2026,mi,di+1).toLocaleDateString('pt-BR');}

function mLucro(mi){
  return data[mi].reduce((s,r)=>{
    const iv=parseFloat(r.i),fv=parseFloat(r.f);
    return(r.i!==''&&r.f!==''&&!isNaN(iv)&&!isNaN(fv))?s+(fv-iv):s;
  },0);
}
function mIni(mi){const r=data[mi].find(r=>r.i!=='');return r?parseFloat(r.i):NaN;}
function mFin(mi){for(let i=data[mi].length-1;i>=0;i--)if(data[mi][i].f!=='')return parseFloat(data[mi][i].f);return NaN;}

function renderTabs(){
  const bar=document.getElementById('tab-bar');
  bar.innerHTML='';
  MONTHS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(tab===i?' active':'');
    b.textContent=m.name.substring(0,3).toUpperCase();
    b.onclick=()=>{tab=i;render();};
    bar.appendChild(b);
  });
  const r=document.createElement('button');
  r.className='tab resumo-tab'+(tab==='resumo'?' active':'');
  r.textContent='Resumo anual';
  r.onclick=()=>{tab='resumo';render();};
  bar.appendChild(r);
}

function renderMonth(mi){
  const lucro=mLucro(mi),ini=mIni(mi),pct=(!isNaN(ini)&&ini!==0)?lucro/ini:NaN;
  const lc=gc(lucro),pc=gc(pct);

  document.getElementById('topbar-mes').textContent=MONTHS[mi].name+' 2026';
  document.getElementById('cards-row').innerHTML=`<div class="cards">
    <div class="card"><div class="card-label">Banca Inicial</div><div class="card-value">${isNaN(ini)?'—':'R$ '+R(ini)}</div></div>
    <div class="card ${lc}"><div class="card-label">Lucro do mês</div><div class="card-value">${isNaN(ini)&&lucro===0?'—':'R$ '+R(lucro)}</div></div>
    <div class="card ${pc}"><div class="card-label">Rentabilidade</div><div class="card-value">${isNaN(pct)?'—':Pct(pct)}</div></div>
  </div>`;

  const thead=`<thead><tr>
    <th class="col-d">Data</th>
    <th class="col-n r">Inicial (R$)</th>
    <th class="col-n r">Final (R$)</th>
    <th class="col-n r">Lucro</th>
    <th class="col-n r">% dia</th>
  </tr></thead>`;

  let rows='';
  data[mi].forEach((r,di)=>{
    const iv=parseFloat(r.i),fv=parseFloat(r.f);
    const lv=(r.i!==''&&r.f!==''&&!isNaN(iv)&&!isNaN(fv))?fv-iv:'';
    const pv=(lv!==''&&iv!==0)?lv/iv:'';
    rows+=`<tr>
      <td class="col-d date-cell">${getDate(mi,di)}</td>
      <td class="col-n"><input type="number" step="0.01" placeholder="0,00" value="${r.i}" data-mi="${mi}" data-di="${di}" data-f="i"/></td>
      <td class="col-n"><input type="number" step="0.01" placeholder="0,00" value="${r.f}" data-mi="${mi}" data-di="${di}" data-f="f"/></td>
      <td class="col-n r ${gc(lv)}">${lv!==''?'R$ '+R(lv):''}</td>
      <td class="col-n r ${gc(pv)}">${pv!==''?Pct(pv):''}</td>
    </tr>`;
  });

  rows+=`<tr class="total-row">
    <td>Total do mês</td><td></td><td></td>
    <td class="r ${lc}">R$ ${R(lucro)}</td>
    <td class="r ${pc}">${isNaN(pct)?'':Pct(pct)}</td>
  </tr>`;

  document.getElementById('main-table').innerHTML=thead+'<tbody>'+rows+'</tbody>';

  document.querySelectorAll('td input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      data[+e.target.dataset.mi][+e.target.dataset.di][e.target.dataset.f]=e.target.value;
      saveData();
      renderMonth(mi);
    });
  });
}

function renderResumo(){
  const bancaIni=mIni(0),bancaFim=mFin(11);
  let totalLucro=0;
  MONTHS.forEach((_,i)=>{totalLucro+=mLucro(i);});
  const pctAnual=(!isNaN(bancaIni)&&bancaIni!==0)?totalLucro/bancaIni:NaN;
  const lc=gc(totalLucro),pc=gc(pctAnual);

  document.getElementById('topbar-mes').textContent='Resumo anual 2026';
  document.getElementById('cards-row').innerHTML=`<div class="cards">
    <div class="card"><div class="card-label">Banca Inicial (jan)</div><div class="card-value">${isNaN(bancaIni)?'—':'R$ '+R(bancaIni)}</div></div>
    <div class="card ${lc}"><div class="card-label">Lucro total anual</div><div class="card-value">${totalLucro===0&&isNaN(bancaIni)?'—':'R$ '+R(totalLucro)}</div></div>
    <div class="card"><div class="card-label">Banca atual (dez)</div><div class="card-value">${isNaN(bancaFim)?'—':'R$ '+R(bancaFim)}</div></div>
  </div>`;

  const thead=`<thead><tr>
    <th>Mês</th>
    <th class="r">Banca Inicial</th>
    <th class="r">Banca Final</th>
    <th class="r">Lucro do mês</th>
    <th class="r">% do mês</th>
  </tr></thead>`;

  let rows='';
  MONTHS.forEach((m,i)=>{
    const lucro=mLucro(i),ini=mIni(i),fin=mFin(i),pct=(!isNaN(ini)&&ini!==0)?lucro/ini:NaN;
    rows+=`<tr>
      <td class="month-name-cell">${m.name}</td>
      <td class="blue">${isNaN(ini)?'—':'R$ '+R(ini)}</td>
      <td class="blue">${isNaN(fin)?'—':'R$ '+R(fin)}</td>
      <td class="r ${gc(lucro)}">${isNaN(ini)?'—':'R$ '+R(lucro)}</td>
      <td class="r ${gc(pct)}">${isNaN(pct)?'—':Pct(pct)}</td>
    </tr>`;
  });

  rows+=`<tr class="total-row">
    <td>Total anual</td><td></td><td></td>
    <td class="r ${lc}">R$ ${R(totalLucro)}</td>
    <td class="r ${pc}">${isNaN(pctAnual)?'—':Pct(pctAnual)}</td>
  </tr>`;

  document.getElementById('main-table').innerHTML=thead+'<tbody>'+rows+'</tbody>';
}

function exportCSV(){
  let csv='Mês;Data;Inicial;Final;Lucro;% Dia\n';
  MONTHS.forEach((m,mi)=>{
    data[mi].forEach((r,di)=>{
      const iv=parseFloat(r.i),fv=parseFloat(r.f);
      const lv=(r.i!==''&&r.f!=='')?fv-iv:'';
      const pv=(lv!==''&&iv!==0)?((lv/iv*100).toFixed(2)+'%'):'';
      csv+=`${m.name};${getDate(mi,di)};${r.i};${r.f};${lv};${pv}\n`;
    });
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='banca_2026.csv';
  a.click();
}

function render(){renderTabs();tab==='resumo'?renderResumo():renderMonth(tab);}

loadData();
render();
</script>
</body>
</html>
